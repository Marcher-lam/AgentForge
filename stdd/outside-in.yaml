ralph_loop:
  max_iterations: 10
  failure_threshold: 3
  auto_rollback: true
  phases: [RED, GREEN, MUTATION, REFACTOR]

constitution:
  blocking_articles: [A2_TDD, A7_Security, A9_CICD]
  active_waivers:
    - article: A2_TDD
      scope: "rlforge/**"
      reason: "mutation score 74.4% < 80%"
      expires: 2026-05-22

test_commands:
  python: "pytest tests/ -x --tb=short -q"
  python_coverage: "pytest tests/ --cov=agentforge --cov=rlforge --cov-report=term-missing"
  frontend: "cd frontend && npx vitest run"
  frontend_coverage: "cd frontend && npx vitest run --coverage"
  mutation_agent_core: "python deep_stryker.py"
  mutation_evo: "python deep_stryker_evo.py"
  mutation_rl: "python deep_stryker_rl.py"
